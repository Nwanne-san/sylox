name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "28.1.0"
  # SHA-256 of stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz,
  # computed locally against the published release asset: this
  # release does not publish its own checksums file, so there is no
  # independent source to verify against. This is trust-on-first-use,
  # not a verification against an authority the release itself
  # supplies; re-compute and update this value on every version bump.
  STELLAR_CLI_SHA256: "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462"
  # technical-doc.md Section 5.8 / the PR #2 and #7 reports: the
  # network's contract_max_size_bytes limit, checked against
  # `stellar network settings` at the time those reports were
  # written. A contract build exceeding this would fail to deploy
  # regardless of how clean its tests and lints are, so it is
  # checked here as its own gate, not folded into the build step.
  CONTRACT_MAX_SIZE_BYTES: 131072

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain inputs needed: rust-toolchain.toml at the repo
      # root pins version and components (rustfmt, clippy) and the
      # wasm32v1-none target for every job that follows. Pinned to
      # the `stable` branch's commit, not the `v1` tag: at `v1`'s
      # commit, `toolchain` is a required input with no default,
      # unlike `stable`, which defaults it to "stable" and lets
      # rust-toolchain.toml's own channel win instead.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  extend-ttl-jq-test:
    name: deploy/extend-ttl.sh jq precedence regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-extend-ttl-jq.sh

  post-demo-signals-build-recent-hours-test:
    name: deploy/post-demo-signals.sh candidate_build_hours regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-post-demo-signals-build-recent-hours.sh

  demo-asset-trigger-parse-i128-test:
    name: deploy/demo-asset-trigger.sh parse_i128 regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-demo-asset-trigger-parse-i128.sh

  demo-asset-trigger-find-revoke-test:
    name: deploy/demo-asset-trigger.sh find_revoke_tx_hash regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-demo-asset-trigger-find-revoke.sh

  demo-asset-trigger-find-clawback-test:
    name: deploy/demo-asset-trigger.sh find_clawback_tx_hash regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-demo-asset-trigger-find-clawback.sh

  demo-asset-trigger-supply-change-bps-test:
    name: deploy/demo-asset-trigger.sh compute_supply_change_bps regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-demo-asset-trigger-supply-change-bps.sh

  demo-asset-trigger-read-tx-epoch-test:
    name: deploy/demo-asset-trigger.sh created_at_to_epoch regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-demo-asset-trigger-read-tx-epoch.sh

  demo-asset-trigger-one-gate-per-step-test:
    name: deploy/demo-asset-trigger.sh one-gate-per-step regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-demo-asset-trigger-one-gate-per-step.sh

  seed-epoch-test:
    name: deploy.sh testnet-demo compute_seed_epoch margin regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-seed-epoch.sh

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests and report run time
        run: |
          start=$(date +%s)
          cargo test --workspace
          end=$(date +%s)
          echo "cargo test --workspace took $((end - start))s"

  extend-ttl-ledgers-to-days-test:
    name: deploy/extend-ttl.sh ledgers_to_days regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/test-extend-ttl-ledgers-to-days.sh

  build-contracts:
    name: stellar contract build (all contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install stellar-cli
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o stellar-cli.tar.gz
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf stellar-cli.tar.gz
          sudo mv stellar /usr/local/bin/stellar
          rm stellar-cli.tar.gz
          stellar --version
      - name: Build every contract
        run: |
          start=$(date +%s)
          stellar contract build
          end=$(date +%s)
          echo "stellar contract build took $((end - start))s"
      - name: Check every Wasm against the network size limit
        run: |
          status=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            size=$(wc -c < "$wasm")
            if [ "$size" -gt "$CONTRACT_MAX_SIZE_BYTES" ]; then
              echo "::error file=$wasm::$wasm is $size bytes, over the $CONTRACT_MAX_SIZE_BYTES byte network limit"
              status=1
            else
              echo "$wasm: $size bytes (limit $CONTRACT_MAX_SIZE_BYTES)"
            fi
          done
          exit $status

  demo-time-not-in-release:
    name: demo-time feature not in the real release wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install stellar-cli
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o stellar-cli.tar.gz
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf stellar-cli.tar.gz
          sudo mv stellar /usr/local/bin/stellar
          rm stellar-cli.tar.gz
          stellar --version
      # The same build deploy/deploy.sh testnet runs: no --features,
      # so this is genuinely the artifact that ships, not a stand-in
      # for it. demo_build_is_false_in_the_real_release_wasm
      # (contracts/risk-oracle/src/test/release_wasm.rs) is #[ignore]d
      # so a normal `cargo test` never touches this file; this job is
      # the one place that builds it first, then runs that test
      # explicitly with --ignored against the real binary.
      - name: Build RiskOracle (real release, no demo-time)
        run: stellar contract build --package risk-oracle
      - name: Prove demo_build() is false in that exact wasm
        run: cargo test -p risk-oracle --lib -- --ignored release_wasm

  demo-time-build:
    name: demo-time feature (per package, not the general test suite)
    runs-on: ubuntu-latest
    # The general test suite (the `test` job above) checks real-world
    # timing on purpose and is never meant to run under demo-time: its
    # fixtures hardcode real EPOCH_SECS/SUB_EPOCH_GRID_SECS values and
    # fail by design once those are scaled. This job instead checks the
    # two things that actually matter for a demo deployment: every
    # contract deploy/deploy.sh testnet-demo builds and deploys still
    # compiles with the feature on, and the handful of tests written
    # specifically for demo-time (not incidentally run under it) still
    # pass. The two adapter crates are left out: deploy/deploy.sh
    # testnet-demo never builds or deploys them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build every contract the demo deploys, with demo-time on
        run: |
          for crate in risk-oracle staking treasury event-registry market-factory series; do
            echo "cargo build -p $crate --features demo-time"
            cargo build -p "$crate" --features demo-time
          done
      - name: sylox-types constants regression test, with demo-time on
        run: cargo test -p sylox-types --features demo-time
      - name: demo_build() reads true, with demo-time on
        run: cargo test -p risk-oracle --features demo-time demo_build_is_true_with_the_demo_time_feature

  web:
    name: web workspace (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Installs web/app, web/landing, web/shared/ui and packages/sdk
      # (npm workspaces declared in the repo-root package.json) in one
      # pass.
      - run: npm ci
      # web/app depends on @sylox/sdk's own compiled dist/ output (its
      # package.json points "types"/"main" there, not at raw src/ - see
      # packages/sdk/package.json's own comment on why, unlike
      # web/shared/ui, this package needs a real build step). This job
      # runs on its own fresh runner, with no filesystem overlap with
      # the separate `sdk` job below (and no `needs:` between them
      # either) - so without this step, web/app's own typecheck/build
      # below fails with "Cannot find module '@sylox/sdk'" against a
      # clean checkout, even though it can look fine locally if a
      # developer's own packages/sdk/dist/ happens to already exist
      # from an unrelated earlier build.
      - name: Build packages/sdk
        run: npm run build -w packages/sdk
      - name: Typecheck web/shared/ui
        run: npx tsc --noEmit
        working-directory: web/shared/ui
      - name: Typecheck web/landing
        run: npx tsc --noEmit
        working-directory: web/landing
      - name: Typecheck web/app
        run: npx tsc --noEmit
        working-directory: web/app
      - name: Lint web/landing
        run: npm run lint
        working-directory: web/landing
      - name: Lint web/app
        run: npm run lint
        working-directory: web/app
      - name: Unit tests, web/shared/ui
        run: npm test
        working-directory: web/shared/ui
      - name: Unit tests, web/landing
        run: npm test
        working-directory: web/landing
      - name: Unit tests, web/app
        run: npm test
        working-directory: web/app
      # Same rule and the same guard pattern as the `docs` job's own
      # banned-word check below: Sylox is protection, never insurance, and
      # never promises a fixed or guaranteed return. Scoped to content.ts
      # (the single source of truth for landing copy, per its own header
      # comment), app/ (page metadata: <title>, meta description, Open
      # Graph/Twitter text) and components/ (section components carry a
      # handful of their own literal strings too - e.g. alt text, aria
      # labels, Faq.tsx's own "Questions, answered plainly." heading) -
      # not the whole web/landing tree, so this never flags copy inside
      # node_modules, generated build output, or test files asserting
      # against this exact check.
      - name: Check for banned words in web/landing content
        working-directory: web/landing
        run: |
          if grep -rinE '\b(insurance|insured?|guarantee[ds]?|APY)\b' content.ts app/ components/; then
            echo "::error::Found a banned word (insurance/insured/insure/guarantee/guaranteed/APY) in web/landing content. Sylox is protection, not insurance, and never promises a guaranteed return."
            exit 1
          fi
      - name: Build web/landing
        run: npm run build -w web/landing
      - name: Build web/app
        run: npm run build -w web/app

  docker-build-sylox-app:
    name: build web/app/Dockerfile image (no push)
    runs-on: ubuntu-latest
    # CI's own web/sdk jobs above build each workspace separately with
    # whatever's already on the runner's npm cache - they don't catch a
    # Dockerfile itself going stale (e.g. a COPY line naming a
    # package.json path that a PR deletes, or a build step ordering
    # that only "works" locally because an unrelated dist/ already
    # exists on disk). Building the real image here, on every PR, is
    # the only thing that actually exercises the Dockerfile's own COPY
    # list and build steps from a clean checkout - never pushed
    # anywhere, just proves it builds.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web/app's Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/app/Dockerfile
          push: false

  docs:
    name: web/docs workspace (typecheck, lint, test, build, contract reference drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # web/docs depends on @sylox/sdk's own compiled dist/ output, same
      # reason the `web` job above builds it first for web/app: this job
      # runs on its own fresh runner with no filesystem overlap with the
      # separate `sdk` job, so without this step web/docs's own
      # typecheck/build below fails with "Cannot find module
      # '@sylox/sdk'" against a clean checkout.
      - name: Build packages/sdk
        run: npm run build -w packages/sdk
      # next typegen (not a plain tsc --noEmit on its own) because this
      # workspace's app/docs/layout.tsx and app/docs/[[...slug]]/page.tsx
      # use Next 16's typed-route helpers (LayoutProps<...>, PageProps<...>),
      # which only exist once Next has generated .next/types/** - web/app
      # and web/landing don't use these helpers, so they don't need this
      # step; see web/docs/package.json's own pretypecheck script, which
      # `npm run typecheck` already wires this through for local/dev use.
      - name: Typecheck web/docs
        run: npm run typecheck
        working-directory: web/docs
      - name: Lint web/docs
        run: npm run lint
        working-directory: web/docs
      - name: Unit tests, web/docs
        run: npm test
        working-directory: web/docs
      - name: Build web/docs
        run: npm run build -w web/docs
      # Same convention as packages/sdk's own networks.generated.ts
      # drift check (see the `sdk` job below): content/docs/
      # contract-reference.mdx is a COMMITTED generated file (this
      # workspace's own prebuild/pretest/predev npm lifecycle hooks
      # already regenerated it once above, as part of `npm test` and
      # `npm run build`) - re-running the generator here and diffing
      # is the actual drift check, so the contract reference page can
      # never silently go stale against deployments/testnet.json, the
      # SDK's contract bindings, or packages/sdk/src/errors.ts.
      - name: Check content/docs/contract-reference.mdx matches its real sources
        working-directory: web/docs
        run: |
          npm run generate:contract-reference
          if ! git diff --exit-code -- content/docs/contract-reference.mdx; then
            echo "::error::web/docs/content/docs/contract-reference.mdx is out of sync with its real sources (deployments/testnet.json, packages/sdk's contract bindings, packages/sdk/src/errors.ts)."
            echo "::error::Run 'npm run generate:contract-reference -w web/docs' locally and commit the result."
            exit 1
          fi
      # Sylox is protection, never insurance, and never promises a
      # fixed or guaranteed return - this repo's own writing rule
      # (see web/docs/content/docs/index.mdx's "Testnet only" section
      # for the canonical phrasing to use instead). Grepping the real
      # committed content catches a slip in a future PR (content is
      # PR 4's own job, not this one) before it ever ships, rather
      # than relying on every future author/reviewer to remember this
      # by hand. Case-insensitive; matches whole words only so this
      # never flags something like "insurance" inside an unrelated
      # word or "APYRIGHT"-style false positive (there isn't one here,
      # but the same guard pattern as this repo's own
      # no-em-dash-guard.sh is worth keeping deliberate). Widened past
      # #78's review to catch the stems too (insured/insure,
      # guarantee/guarantees), not just the one inflected form each -
      # the review's own first pass slipped through with "guarantee"
      # (no -d), which the original guaranteed-only check would have
      # missed entirely.
      - name: Check for banned words in web/docs content
        working-directory: web/docs
        run: |
          if grep -rinE '\b(insurance|insured?|guarantee[ds]?|APY)\b' content/; then
            echo "::error::Found a banned word (insurance/insured/insure/guarantee/guaranteed/APY) in web/docs/content. Sylox is protection, not insurance, and never promises a guaranteed return - see content/docs/index.mdx's Testnet only section for the house phrasing."
            exit 1
          fi

  docker-build-sylox-docs:
    name: build web/docs/Dockerfile image (no push)
    runs-on: ubuntu-latest
    # Same reasoning as docker-build-sylox-app above: the `docs` job
    # builds the workspace directly with whatever's on the runner's npm
    # cache, which never exercises the Dockerfile's own COPY list or
    # build-step ordering from a clean checkout. Never pushed anywhere,
    # just proves it builds.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web/docs's Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/docs/Dockerfile
          push: false

  sdk:
    name: packages/sdk (typecheck, test, build, networks drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck packages/sdk
        run: npx tsc --noEmit
        working-directory: packages/sdk
      # Unit tests - pretest's own generate:networks npm lifecycle hook
      # regenerates src/networks.generated.ts from the committed
      # deployments/testnet.json + testnet-demo-asset.json before vitest
      # runs, same as a local `npm test`.
      - name: Unit tests, packages/sdk
        run: npm test
        working-directory: packages/sdk
      - name: Build packages/sdk
        run: npm run build -w packages/sdk
      # PR #69 review, required fix #1: src/networks.generated.ts is a
      # COMMITTED generated file (scripts/generate-networks.mjs's own
      # doc comment and this package's README's "Regenerating after a
      # redeploy" section) - it must never silently drift from
      # deployments/testnet.json / deployments/testnet-demo-asset.json.
      # The build step above already regenerated it once (prebuild);
      # re-running the generator here and diffing is the actual drift
      # check - a clean build only proves the file compiles, not that
      # it still matches what's committed. Fails loudly, with the diff
      # printed, if whoever last touched either source JSON file forgot
      # to regenerate and commit this file.
      - name: Check src/networks.generated.ts matches the committed deployment files
        working-directory: packages/sdk
        run: |
          npm run generate:networks
          if ! git diff --exit-code -- src/networks.generated.ts; then
            echo "::error::packages/sdk/src/networks.generated.ts is out of sync with deployments/testnet.json and/or deployments/testnet-demo-asset.json."
            echo "::error::Run 'npm run generate:networks -w packages/sdk' locally and commit the result."
            exit 1
          fi

  deploy-sylox-app:
    name: deploy sylox-app to Railway
    runs-on: ubuntu-latest
    # Only a real push to main, never a PR (a PR branch's build should
    # never reach production), and only once every existing check has
    # passed - a broken contract build or a failing Rust test on main
    # blocks this exactly like it blocks everything else.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, test, build-contracts, web, extend-ttl-jq-test, sdk, extend-ttl-ledgers-to-days-test, docker-build-sylox-app]
    # One deploy at a time, in order - a second push landing while the
    # first is still deploying queues behind it instead of racing it
    # (never cancel-in-progress: a deploy that's already uploading to
    # Railway shouldn't be cut off mid-flight).
    concurrency:
      group: deploy-sylox-app
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The whole push can be more than one commit; need full history to diff github.event.before..github.sha below, not just the latest commit's own parent.
      # The workflow's own path filter, not Railway's - see the
      # service's README (web/app/README.md's "Deployment" section)
      # for why: Railway's watch-path evaluation has been observed
      # skipping deploys that genuinely touched a watched path (a
      # confirmed bug, reported to Railway support) and, separately,
      # skipping every direct `railway up` upload outright regardless
      # of content (an upload carries no changed-files list for
      # Railway's watch-path check to match against, so with any watch
      # paths set it always skips) - which is why sylox-app's own
      # Railway watch paths are cleared to empty; this job's filter is
      # the only one that runs.
      - name: Check whether anything deploy-relevant changed
        id: changes
        run: |
          before="${{ github.event.before }}"
          # All-zeros is GitHub's own sentinel for "no prior commit to
          # diff from" (a new branch, or a force-push that rewrites
          # history past what GitHub had). An empty value shouldn't
          # happen on a real push event, but is treated the same way -
          # always deploy rather than risk silently skipping a real
          # change because there was nothing safe to diff against.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No prior commit to diff from (new branch or force-push) - treating as relevant."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$before" "${{ github.sha }}")
            echo "Changed files ($before..${{ github.sha }}):"
            echo "$changed"
            if echo "$changed" | grep -qE '^(web/app/|web/shared/|packages/sdk/|deployments/|package\.json$|package-lock\.json$)'; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
            else
              echo "relevant=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Install the Railway CLI
        if: steps.changes.outputs.relevant == 'true'
        # Pinned to the exact version this workflow was tested against
        # locally (see web/app/README.md) - not @latest, so a Railway
        # CLI release doesn't silently change deploy behavior here.
        run: npm install -g @railway/cli@5.64.2
      - name: Deploy sylox-app
        if: steps.changes.outputs.relevant == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying commit ${{ github.sha }} to sylox-app"
          railway up --service sylox-app --ci

  deploy-sylox-docs:
    name: deploy sylox-docs to Railway
    runs-on: ubuntu-latest
