[package]
name = "governor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
sylox-types = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
soroban-sdk = { workspace = true, features = ["testutils"] }
risk-oracle = { path = "../risk-oracle", features = ["testutils"] }
event-registry = { path = "../event-registry", features = ["testutils"] }
staking = { path = "../staking", features = ["testutils"] }
treasury = { path = "../treasury", features = ["testutils"] }
market-factory = { path = "../market-factory", features = ["testutils"] }
series = { path = "../series", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
demo-time = ["sylox-types/demo-time"]
